<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaimSnap — Claims Queue</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#0b0f15; --bg2:#141b24; --bg3:#1b232e;
    --ink:#eaeef4; --muted:#93a1b2; --faint:#64717f;
    --line:#242e3a; --line2:#32404f;
    --accent:#e8a33d; --accent2:#4da3ff;
    --minor:#3fb573; --moderate:#d9a21b; --severe:#e05252;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    margin-bottom:22px;flex-wrap:wrap}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,34px);
    letter-spacing:-.02em;margin:0}
  .sub{color:var(--muted);font-size:13.5px;margin:6px 0 0;max-width:56ch}
  button{font:inherit;font-family:var(--body);font-weight:600;font-size:13px;
    padding:9px 14px;border-radius:8px;border:1px solid var(--line2);
    background:var(--bg2);color:var(--muted);cursor:pointer}
  button:hover{color:var(--ink);background:var(--bg3)}

  .empty{background:var(--bg2);border:1px dashed var(--line2);border-radius:14px;
    padding:48px 24px;text-align:center;color:var(--muted)}
  .empty a{color:var(--accent2)}

  .list{display:flex;flex-direction:column;gap:10px}
  .claim{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer}
  .row:hover{background:var(--bg3)}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:0 0 auto;
    background:var(--bg3);border:1px solid var(--line)}
  .meta{flex:1;min-width:0}
  .meta .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .fname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .line2{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;padding:4px 10px;border-radius:999px;flex:0 0 auto}
  .badge.minor{color:var(--minor);background:rgba(63,181,115,.14)}
  .badge.moderate{color:var(--moderate);background:rgba(217,162,27,.14)}
  .badge.severe{color:var(--severe);background:rgba(224,82,82,.14)}
  .badge.none{color:var(--faint);background:rgba(100,113,127,.14)}
  .chev{color:var(--faint);font-size:12px;flex:0 0 auto;transition:transform .15s}
  .claim.open .chev{transform:rotate(90deg)}
  .detail{display:none;border-top:1px solid var(--line);padding:14px 16px 16px}
  .claim.open .detail{display:block}
  pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:12px;font-family:var(--mono);font-size:12px;color:var(--muted);
    white-space:pre-wrap;max-height:360px;overflow:auto}
</style>
</head>
<body>
<script src="bg.js"></script>
<script src="nav.js"></script>

<div class="wrap">
  <header>
    <div>
      <h1>Claims Queue</h1>
      <p class="sub">Every claim triaged with ClaimSnap on this device, newest first. Nothing here ever leaves your browser.</p>
    </div>
    <button id="clear">Clear all</button>
  </header>

  <div id="empty" class="empty" hidden>
    No claims yet. <a href="new-claim.html">Triage a photo</a> and it will show up here.
  </div>

  <div id="list" class="list"></div>
</div>

<script>
const KEY = 'claimsnap_claims';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
}

function render() {
  const claims = load();
  $('empty').hidden = claims.length > 0;
  $('list').innerHTML = claims.map((c, i) => {
    const sev = c.overall_severity || 'none';
    const sevClass = ['minor', 'moderate', 'severe'].includes(sev) ? sev : 'none';
    const detLine = c.detections && c.detections.length
      ? c.detections.map(d => `${d.type} (${d.severity})`).join(', ')
      : 'no trained damage type found';
    const when = new Date(c.generated).toLocaleString();
    return `
    <div class="claim" data-i="${i}">
      <div class="row">
        ${c.thumb ? `<img class="thumb" src="${c.thumb}" alt="">` : '<div class="thumb"></div>'}
        <div class="meta">
          <div class="top"><span class="fname">${esc(c.file || 'photo')}</span><span class="time">${when}</span></div>
          <div class="line2">${esc(detLine)}</div>
        </div>
        <span class="badge ${sevClass}">${sev}</span>
        <span class="chev">▸</span>
      </div>
      <div class="detail"><pre>${esc(c.summaryText || '(no summary saved)')}</pre></div>
    </div>`;
  }).join('');

  $('list').querySelectorAll('.row').forEach(row => {
    row.onclick = () => row.closest('.claim').classList.toggle('open');
  });
}

$('clear').onclick = () => {
  if (!load().length) return;
  if (confirm('Remove every claim from this device? This cannot be undone.')) {
    localStorage.removeItem(KEY);
    render();
  }
};

render();
</script>
</body>
</html>
